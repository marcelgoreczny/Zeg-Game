<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valhalla Maze</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ekran startowy -->
    <div id="startScreen">
        <h1>Valhalla Maze</h1>
        <button id="startButton">Rozpocznij grę</button>
    </div>

    <!-- Interfejs użytkownika -->
    <div id="ui">
        <p>Poziom: <span id="level">1</span></p>
        <p>HP: <span id="hp">100</span></p>
        <p>Przedmioty: <span id="items">0</span></p>
    </div>

    <!-- Canvas gry -->
    <canvas id="gameCanvas" width="640" height="640"></canvas>

    <!-- Komunikaty -->
    <div id="message"></div>

    <!-- Restart gry -->
    <button id="restartButton">Restart gry</button>

    <!-- Połączenie z JavaScript -->
    <script src="script.js"></script>

</body>
</html>
